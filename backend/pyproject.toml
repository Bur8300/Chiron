[project]
name = "chiron-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "asyncpg>=0.32.0",
    "fastapi[standard]>=0.162.2",
    "pgvector>=0.5.1",
    "sqlalchemy[asyncio]>=2.1.8",
]

[dependency-groups]
dev = [
    "openapi-spec-validator>=0.9.0",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "pyyaml>=6.0.3",
    "ruff>=0.17.4",
]

[tool.pytest.ini_options]
# Tests live in the root tests/ folder (AGENTS.md section 2).
testpaths = ["../tests/backend"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
src = [".", "../tests/backend"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.coverage.run]
# Measure only the application code, not the tests.
source = ["app"]
branch = true

[tool.coverage.report]
show_missing = true
skip_empty = true
