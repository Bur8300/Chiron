="#fff" stroke="#b7bfcc"/><text x="30" y="438" font-family="Arial, sans-serif" font-size="15" fill="#263248" font-weight="400">Kısa sınavlar</text></a><a href="index.html#planner" target="_top"><rect x="16" y="470" width="198" height="48" rx="10" fill="#e8ebf0" stroke="#b7bfcc"/><text x="30" y="500" font-family="Arial, sans-serif" font-size="15" fill="#263248" font-weight="400">Çalışma planım</text></a><text x="290" y="140" font-family="Arial, sans-serif" font-size="34" fill="#263248" font-weight="700">Haftalık çalışma planım</text><text x="290" y="172" font-family="Arial, sans-serif" font-size="12" fill="#263248" font-weight="400">UC-08 · FR-27–FR-31</text><text x="290" y="201" font-family="Arial, sans-serif" font-size="12" fill="#263248" font-weight="400">Önerilen ekran düzeni · gerçek veri içermez</text><rect x="290" y="230" width="1090" height="112" rx="10" fill="#fff" stroke="#b7bfcc"/><text x="306" y="260" font-family="Arial, sans-serif" font-size="16" fill="#263248" font-weight="700">1. Hafta ve veri tarihi</text><text x="306" y="287" font-family="Arial, sans-serif" font-size="14" fill="#46536a" font-weight="400">Plan haftası ve kullanılan notların tarihi.</text><rect x="290" y="358" width="1090" height="112" rx="10" fill="#fff" stroke="#b7bfcc"/><text x="306" y="388" font-family="Arial, sans-serif" font-size="16" fill="#263248" font-weight="700">2. Odaklanılacak konu</text><text x="306" y="415" font-family="Arial, sans-serif" font-size="14" fill="#46536a" font-weight="400">Başarı oranı ve neden gelişime açık olduğu.</text><rect x="290" y="486" width="1090" height="112" rx="10" fill="#fff" stroke="#b7bfcc"/><text x="306" y="516" font-family="Arial, sans-serif" font-size="16" fill="#263248" font-weight="700">3. Çalışma süresi</text><text x="306" y="543" font-family="Arial, sans-serif" font-size="14" fill="#46536a" font-weight="400">Konu başına saat ve önerilen çalışma adımları.</text><rect x="290" y="614" width="1090" height="112" rx="10" fill="#fff" stroke="#b7bfcc"/><text x="306" y="644" font-family="Arial, sans-serif" font-size="16" fill="#263248" font-weight="700">4. Diğer konular</text><text x="306" y="671" font-family="Arial, sans-serif" font-size="14" fill="#46536a" font-weight="400">Gelişime açık konuların sıralı listesi.</text><rect x="290" y="750" width="1090" height="98" rx="10" fill="#edf0f4" stroke="#b7bfcc"/><text x="306" y="779" font-family="Arial, sans-serif" font-size="14" fill="#263248" font-weight="700">Alternatif / hata durumları</text><text x="306" y="804" font-family="Arial, sans-serif" font-size="13" fill="#46536a" font-weight="400">Zayıf konu yoksa bunu açıkla. AI adımları yoksa varsayılan adımlar.</text><text x="290" y="874" font-family="Arial, sans-serif" font-size="11" fill="#263248" font-weight="400">WBS-11.3 · Faruk Özbek · 12.11.2026 · Taslak</text></svg>