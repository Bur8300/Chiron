<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1080" viewBox="0 0 360 1080" role="img" aria-labelledby="title desc"><title id="title">Derslerim — phone wireframe</title><desc id="desc">Proposed interface, not an implemented feature. Illustrative controls and notes describe the proposed states. No live student data.</desc><rect x="0" y="0" width="360" height="1080" rx="0" fill="#f5f6f8" stroke="#b7bfcc"/><rect x="0" y="0" width="360" height="80" rx="0" fill="#fff" stroke="#b7bfcc"/><text x="24" y="48" font-family="Arial, sans-serif" font-size="26" fill="#263248" font-weight="700">Chiron</text><text x="250" y="46" font-family="Arial, sans-serif" font-size="12" fill="#263248" font-weight="400">TASLAK</text><rect x="20" y="96" width="320" height="46" rx="10" fill="#fff" stroke="#b7bfcc"/><text x="34" y="124" font-family="Arial, sans-serif" font-size="14" fill="#263248" font-weight="400">Menü / geçerli ders / rol</text><text x="20" y="180" font-family="Arial, sans-serif" font-size="25" fill="#263248" font-weight="700">Derslerim</text><text x="20" y="212" font-family="Arial, sans-serif" font-size="12" fill="#263248" font-weight="400">UC-03 · FR-10</text><text x="20" y="237" font-family="Arial, sans-serif" font-size="12" fill="#263248" font-weight="400">Önerilen ekran düzeni · gerçek veri içermez</text><rect x="20" y="266" width="320" height="116" rx="10" fill="#fff" stroke="#b7bfcc"/><text x="36" y="296" font-family="Arial, sans-serif" font-size="16" fill="#263248" font-weight="700">1. Ders seçimi</text><text x="36" y="323" font-family="Arial, sans-serif" font-size="14" fill="#46536a" font-weight="400">Ders adı / üniteler / konular.</text><text x="36" y="344" font-family="Arial, sans-serif" font-size="14" fill="#46536a" font-weight="400">Veriler portaldan gelir.</text><rect x="20" y="398" width="320" height="116" rx="10" fill="#fff" stroke="#b7bfcc"/><text x="36" y="428" font-family="Arial, sans-serif" font-size="16" fill="#263248" font-weight="700">2. Ders çalışma alanı</text><text x="36" y="455" font-family="Arial, sans-serif" font-size="14" fill="#46536a" font-weight="400">Seçili ders: kaynaklar, soru-</text><text x="36" y="476" font-family="Arial, sans-serif" font-size="14" fill="#46536a" font-weight="400">cevap, özet, sınav.</text><rect x="20" y="530" width="320" height="116" rx="10" fill="#fff" stroke="#b7bfcc"/><text x="36" y="560" font-family="Arial, sans-serif" font-size="16" fill="#263248" font-weight="700">3. Haftalık çalışma planı</text><text x="36" y="587" font-family="Arial, sans-serif" font-size="14" fill="#46536a" font-weight="400">Gelişime açık konular ve çalışma</text><text x="36" y="608" font-family="Arial, sans-serif" font-size="14" fill="#46536a" font-weight="400">adımları.</text><rect x="20" y="670" width="320" height="152" rx="10" fill="#edf0f4" stroke="#b7bfcc"/><text x="36" y="699" font-family="Arial, sans-serif" font-size="14" fill="#263248" font-weight="700">Alternatif / hata durumları</text><text x="36" y="724" font-family="Arial, sans-serif" font-size="13" fill="#46536a" font-weight="400">Ders yoksa boş durum. Portal</text><text x="36" y="744" font-family="Arial, sans-serif" font-size="13" fill="#46536a" font-weight="400">hatasında son veri ve tarihi</text><text x="36" y="764" font-family="Arial, sans-serif" font-size="13" fill="#46536a" font-weight="400">göster.</text><text x="20" y="1054" font-family="Arial, sans-serif" font-size="11" fill="#263248" font-weight="400">WBS-11.3 · Faruk Özbek · 13.11.2026 · Taslak</text></svg>