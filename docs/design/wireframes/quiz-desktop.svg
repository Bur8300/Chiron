<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc"><title id="title">Kısa sınav — desktop wireframe</title><desc id="desc">Proposed interface, not an implemented feature. Illustrative controls and notes describe the proposed states. No live student data.</desc><rect x="0" y="0" width="1440" height="900" rx="0" fill="#f5f6f8" stroke="#b7bfcc"/><rect x="0" y="0" width="1440" height="80" rx="0" fill="#fff" stroke="#b7bfcc"/><text x="24" y="48" font-family="Arial, sans-serif" font-size="26" fill="#263248" font-weight="700">Chiron</text><text x="1200" y="46" font-family="Arial, sans-serif" font-size="12" fill="#263248" font-weight="400">WIREFRAME · TASLAK</text><rect x="0" y="80" width="230" height="820" rx="0" fill="#fff" stroke="#b7bfcc"/><text x="26" y="130" font-family="Arial, sans-serif" font-size="12" fill="#263248" font-weight="400">ÇALIŞMA ALANI</text><a href="index.html#courses" target="_top"><rect x="16" y="160" width="198" height="48" rx="10" fill="#fff" stroke="#b7bfcc"/><text x="30" y="190" font-family="Arial, sans-serif" font-size="15" fill="#263248" font-weight="400">Derslerim</text></a><a href="index.html#sources" target="_top"><rect x="16" y="222" width="198" height="48" rx="10" fill="#fff" stroke="#b7bfcc"/><text x="30" y="252" font-family="Arial, sans-serif" font-size="15" fill="#263248" font-weight="400">Kaynaklarım</text></a><a href="index.html#questions" target="_top"><rect x="16" y="284" width="198" height="48" rx="10" fill="#fff" stroke="#b7bfcc"/><text x="30" y="314" font-family="Arial, sans-serif" font-size="15" fill="#263248" font-weight="400">Soru sor</text></a><a href="index.html#summaries" target="_top"><rect x="16" y="346" width="198" height="48" rx="10" fill="#fff" stroke="#b7bfcc"/><text x="30" y="376" font-family="Arial, sans-serif" font-size="15" fill="#263248" font-weight="400">Özetlerim</text></a><a href="index.html#quiz" target="_top"><rect x="16" y="408" width="198" height="48" rx="10" fill="#e8ebf0" stroke="#b7bfcc"/><text x="30" y="438" font-family="Arial, sans-serif" font-size="15" fill="#263248" font-weight="400">Kısa sınavlar</text></a><a href="index.html#planner" target="_top"><rect x="16" y="470" width="198" height="48" rx="10" fill="#fff" stroke="#b7bfcc"/><text x="30" y="500" font-family="Arial, sans-serif" font-size="15" fill="#263248" font-weight="400">Çalışma planım</text></a><text x="290" y="140" font-family="Arial, sans-serif" font-size="34" fill="#263248" font-weight="700">Kısa sınav</text><text x="290" y="182" font-family="Arial, sans-serif" font-size="12" fill="#263248" font-weight="400">UC-07 · FR-22–FR-25</text><text x="290" y="207" font-family="Arial, sans-serif" font-size="12" fill="#263248" font-weight="400">Önerilen ekran düzeni · gerçek veri içermez</text><rect x="290" y="236" width="1090" height="112" rx="10" fill="#fff" stroke="#b7bfcc"/><text x="306" y="266" font-family="Arial, sans-serif" font-size="16" fill="#263248" font-weight="700">1. Ders ve hazır kaynaklar</text><text x="306" y="293" font-family="Arial, sans-serif" font-size="14" fill="#46536a" font-weight="400">Kaynağa dayalı 5–10 çoktan seçmeli soru.</text><rect x="290" y="364" width="1090" height="112" rx="10" fill="#fff" stroke="#b7bfcc"/><text x="306" y="394" font-family="Arial, sans-serif" font-size="16" fill="#263248" font-weight="700">2. Soru ve seçenekler</text><text x="306" y="421" font-family="Arial, sans-serif" font-size="14" fill="#46536a" font-weight="400">Radyo düğmeleri; görünür soru ve grup etiketi.</text><rect x="290" y="492" width="1090" height="112" rx="10" fill="#fff" stroke="#b7bfcc"/><text x="306" y="522" font-family="Arial, sans-serif" font-size="16" fill="#263248" font-weight="700">3. Yanıtları gönder</text><text x="306" y="549" font-family="Arial, sans-serif" font-size="14" fill="#46536a" font-weight="400">Göndermeden doğru yanıtı gösterme.</text><rect x="290" y="620" width="1090" height="112" rx="10" fill="#fff" stroke="#b7bfcc"/><text x="306" y="650" font-family="Arial, sans-serif" font-size="16" fill="#263248" font-weight="700">4. Sonuç ve atıflar</text><text x="306" y="677" font-family="Arial, sans-serif" font-size="14" fill="#46536a" font-weight="400">Puan, doğru yanıtlar, konular ve kaynak pasajları.</text><rect x="290" y="756" width="1090" height="98" rx="10" fill="#edf0f4" stroke="#b7bfcc"/><text x="306" y="785" font-family="Arial, sans-serif" font-size="14" fill="#263248" font-weight="700">Alternatif / hata durumları</text><text x="306" y="810" font-family="Arial, sans-serif" font-size="13" fill="#46536a" font-weight="400">Üretim hatası: mesaj ve tekrar deneme (FR-25). Boş yanıt politikası ekipçe doğrulanmalı.</text><text x="290" y="874" font-family="Arial, sans-serif" font-size="11" fill="#263248" font-weight="400">WBS-11.3 · Faruk Özbek · 13.11.2026 · Taslak</text></svg>