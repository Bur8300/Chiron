<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1080" viewBox="0 0 360 1080" role="img" aria-labelledby="title desc"><title id="title">Giriş yap — phone wireframe</title><desc id="desc">Proposed interface, not an implemented feature. Illustrative controls and notes describe the proposed states. No live student data.</desc><rect x="0" y="0" width="360" height="1080" rx="0" fill="#f5f6f8" stroke="#b7bfcc"/><rect x="0" y="0" width="360" height="80" rx="0" fill="#fff" stroke="#b7bfcc"/><text x="24" y="48" font-family="Arial, sans-serif" font-size="26" fill="#263248" font-weight="700">Chiron</text><text x="250" y="46" font-family="Arial, sans-serif" font-size="12" fill="#263248" font-weight="400">TASLAK</text><rect x="20" y="96" width="320" height="46" rx="10" fill="#fff" stroke="#b7bfcc"/><text x="34" y="124" font-family="Arial, sans-serif" font-size="14" fill="#263248" font-weight="400">Menü / geçerli ders / rol</text><text x="20" y="180" font-family="Arial, sans-serif" font-size="25" fill="#263248" font-weight="700">Giriş yap</text><text x="20" y="212" font-family="Arial, sans-serif" font-size="12" fill="#263248" font-weight="400">UC-01 · FR-03–FR-06</text><text x="20" y="237" font-family="Arial, sans-serif" font-size="12" fill="#263248" font-weight="400">Önerilen ekran düzeni · gerçek veri içermez</text><rect x="20" y="266" width="320" height="116" rx="10" fill="#fff" stroke="#b7bfcc"/><text x="36" y="296" font-family="Arial, sans-serif" font-size="16" fill="#263248" font-weight="700">1. Portal kimliği</text><text x="36" y="323" font-family="Arial, sans-serif" font-size="14" fill="#46536a" font-weight="400">Okul portalındaki hesabının</text><text x="36" y="344" font-family="Arial, sans-serif" font-size="14" fill="#46536a" font-weight="400">kimliği.</text><rect x="20" y="398" width="320" height="116" rx="10" fill="#fff" stroke="#b7bfcc"/><text x="36" y="428" font-family="Arial, sans-serif" font-size="16" fill="#263248" font-weight="700">2. Şifre</text><text x="36" y="455" font-family="Arial, sans-serif" font-size="14" fill="#46536a" font-weight="400">Şifre yöneticisi ve yapıştırma</text><text x="36" y="476" font-family="Arial, sans-serif" font-size="14" fill="#46536a" font-weight="400">desteklenir.</text><rect x="20" y="530" width="320" height="116" rx="10" fill="#fff" stroke="#b7bfcc"/><text x="36" y="560" font-family="Arial, sans-serif" font-size="16" fill="#263248" font-weight="700">3. Giriş yap</text><text x="36" y="587" font-family="Arial, sans-serif" font-size="14" fill="#46536a" font-weight="400">Geçerli hesap → rolün başlangıç</text><text x="36" y="608" font-family="Arial, sans-serif" font-size="14" fill="#46536a" font-weight="400">sayfası.</text><rect x="20" y="662" width="320" height="116" rx="10" fill="#fff" stroke="#b7bfcc"/><text x="36" y="692" font-family="Arial, sans-serif" font-size="16" fill="#263248" font-weight="700">4. İlk kez mi geliyorsun?</text><text x="36" y="719" font-family="Arial, sans-serif" font-size="14" fill="#46536a" font-weight="400">Hesabını etkinleştir →</text><text x="36" y="740" font-family="Arial, sans-serif" font-size="14" fill="#46536a" font-weight="400">etkinleştirme ekranı.</text><rect x="20" y="802" width="320" height="152" rx="10" fill="#edf0f4" stroke="#b7bfcc"/><text x="36" y="831" font-family="Arial, sans-serif" font-size="14" fill="#263248" font-weight="700">Alternatif / hata durumları</text><text x="36" y="856" font-family="Arial, sans-serif" font-size="13" fill="#46536a" font-weight="400">Hatalı kimlik veya şifre: aynı</text><text x="36" y="876" font-family="Arial, sans-serif" font-size="13" fill="#46536a" font-weight="400">hata mesajı. Alan değerlerini</text><text x="36" y="896" font-family="Arial, sans-serif" font-size="13" fill="#46536a" font-weight="400">koru.</text><text x="20" y="1054" font-family="Arial, sans-serif" font-size="11" fill="#263248" font-weight="400">WBS-11.3 · Faruk Özbek · 13.11.2026 · Taslak</text></svg>