<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1080" viewBox="0 0 360 1080" role="img" aria-labelledby="title desc"><title id="title">Hesabını etkinleştir — phone wireframe</title><desc id="desc">Proposed interface, not an implemented feature. Boxes describe controls and states.</desc><rect x="0" y="0" width="360" height="1080" rx="0" fill="#f5f6f8" stroke="#b7bfcc"/><rect x="0" y="0" width="360" height="80" rx="0" fill="#fff" stroke="#b7bfcc"/><text x="24" y="48" font-family="Arial, sans-serif" font-size="26" fill="#263248" font-weight="700">Chiron</text><text x="250" y="46" font-family="Arial, sans-serif" font-size="12" fill="#263248" font-weight="400">TASLAK</text><rect x="20" y="96" width="320" height="46" rx="10" fill="#fff" stroke="#b7bfcc"/><text x="34" y="124" font-family="Arial, sans-serif" font-size="14" fill="#263248" font-weight="400">Menü / geçerli ders / rol</text><text x="20" y="180" font-family="Arial, sans-serif" font-size="25" fill="#263248" font-weight="700">Hesabını etkinleştir</text><text x="20" y="212" font-family="Arial, sans-serif" font-size="12" fill="#263248" font-weight="400">UC-01 · FR-02</text><text x="20" y="241" font-family="Arial, sans-serif" font-size="12" fill="#263248" font-weight="400">Önerilen ekran düzeni · gerçek veri içermez</text><rect x="20" y="270" width="320" height="116" rx="10" fill="#fff" stroke="#b7bfcc"/><text x="36" y="300" font-family="Arial, sans-serif" font-size="16" fill="#263248" font-weight="700">1. Portal kimliği</text><text x="36" y="327" font-family="Arial, sans-serif" font-size="14" fill="#46536a" font-weight="400">Yalnızca portalda bulunan</text><text x="36" y="348" font-family="Arial, sans-serif" font-size="14" fill="#46536a" font-weight="400">hesaplar.</text><rect x="20" y="402" width="320" height="116" rx="10" fill="#fff" stroke="#b7bfcc"/><text x="36" y="432" font-family="Arial, sans-serif" font-size="16" fill="#263248" font-weight="700">2. Yeni şifre</text><text x="36" y="459" font-family="Arial, sans-serif" font-size="14" fill="#46536a" font-weight="400">Şifre kuralları erişim tasarımında</text><text x="36" y="480" font-family="Arial, sans-serif" font-size="14" fill="#46536a" font-weight="400">belirlenecek.</text><rect x="20" y="534" width="320" height="116" rx="10" fill="#fff" stroke="#b7bfcc"/><text x="36" y="564" font-family="Arial, sans-serif" font-size="16" fill="#263248" font-weight="700">3. Hesabını etkinleştir</text><text x="36" y="591" font-family="Arial, sans-serif" font-size="14" fill="#46536a" font-weight="400">Başarılı işlem → rolün başlangıç</text><text x="36" y="612" font-family="Arial, sans-serif" font-size="14" fill="#46536a" font-weight="400">sayfası.</text><rect x="20" y="666" width="320" height="116" rx="10" fill="#fff" stroke="#b7bfcc"/><text x="36" y="696" font-family="Arial, sans-serif" font-size="16" fill="#263248" font-weight="700">4. Zaten bir hesabın var mı?</text><text x="36" y="723" font-family="Arial, sans-serif" font-size="14" fill="#46536a" font-weight="400">Girişe dön.</text><rect x="20" y="806" width="320" height="132" rx="10" fill="#edf0f4" stroke="#b7bfcc"/><text x="36" y="835" font-family="Arial, sans-serif" font-size="14" fill="#263248" font-weight="700">Alternatif / hata durumları</text><text x="36" y="860" font-family="Arial, sans-serif" font-size="13" fill="#46536a" font-weight="400">Portal hesabı bulunamadı veya</text><text x="36" y="880" font-family="Arial, sans-serif" font-size="13" fill="#46536a" font-weight="400">hesap zaten etkin. Açık kayıt</text><text x="36" y="900" font-family="Arial, sans-serif" font-size="13" fill="#46536a" font-weight="400">sunulmaz.</text><text x="20" y="1054" font-family="Arial, sans-serif" font-size="11" fill="#263248" font-weight="400">WBS-11.3 · Faruk Özbek · 12.11.2026 · Taslak</text></svg>