rial, sans-serif" font-size="13" fill="#46536a" font-weight="400">Kaynakta yanıt yok / limit ve</text><text x="36" y="916" font-family="Arial, sans-serif" font-size="13" fill="#46536a" font-weight="400">sıfırlama tarihi / servis hatası.</text><text x="36" y="936" font-family="Arial, sans-serif" font-size="13" fill="#46536a" font-weight="400">Geçmiş: Should.</text><text x="20" y="1054" font-family="Arial, sans-serif" font-size="11" fill="#263248" font-weight="400">WBS-11.3 · Faruk Özbek · 13.11.2026 · Taslak</text></svg>