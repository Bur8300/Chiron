size="16" fill="#263248" font-weight="700">4. İlk kez mi geliyorsun?</text><text x="306" y="671" font-family="Arial, sans-serif" font-size="14" fill="#46536a" font-weight="400">Hesabını etkinleştir → etkinleştirme ekranı.</text><rect x="290" y="750" width="1090" height="98" rx="10" fill="#edf0f4" stroke="#b7bfcc"/><text x="306" y="779" font-family="Arial, sans-serif" font-size="14" fill="#263248" font-weight="700">Alternatif / hata durumları</text><text x="306" y="804" font-family="Arial, sans-serif" font-size="13" fill="#46536a" font-weight="400">Hatalı kimlik veya şifre: aynı hata mesajı. Alan değerlerini koru.</text><text x="290" y="874" font-family="Arial, sans-serif" font-size="11" fill="#263248" font-weight="400">WBS-11.3 · Faruk Özbek · 12.11.2026 · Taslak</text></svg>