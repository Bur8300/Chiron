# Local services for development and tests.
# Start: docker compose -f infra/docker-compose.yml up -d
services:
  db:
    image: pgvector/pgvector:0.8.1-pg17
    environment:
      POSTGRES_USER: chiron
      POSTGRES_PASSWORD: chiron
      POSTGRES_DB: chiron
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chiron"]
      interval: 2s
      timeout: 3s
      retries: 15
