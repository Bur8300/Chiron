name: CI

# No path filters: the jobs become required checks on main,
# and a skipped required check blocks the PR (for example a docs-only PR).
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Cancel old runs only on PRs. Every commit on main keeps its full CI result.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      # setup-uv publishes only full version tags (no moving v10 tag).
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check . ../tests/backend
      - run: uv run ruff format --check . ../tests/backend
      - run: uv run pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      # Lints frontend/src and tests/frontend. Warnings fail the run (see package.json).
      - run: npm run lint
      - run: npm run typecheck:tests
      - run: npm test
      - run: npm run build
